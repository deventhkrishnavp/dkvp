
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendor Portal</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .form-container {
      width: 350px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-container input[type="text"],
    .form-container input[type="email"],
    .form-container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .form-container button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-container button:hover {
      background: #0056b3;
    }

    .toggle-btn {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #007bff;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .dashboard {
      display: none;
      padding: 20px;
      background: #fff;
      margin-top: 20px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .dashboard h3 {
      color: #333;
    }
  </style>
</head>
<body>

  <div class="form-container" id="registerForm">
    <h2>Vendor Registration</h2>
    <input type="text" placeholder="Business Name" required />
    <input type="email" placeholder="Email" required />
    <input type="password" placeholder="Password" required />
    <button onclick="showDashboard()">Register</button>
    <div class="toggle-btn" onclick="toggleForms()">Already have an account? Login</div>
  </div>

  <div class="form-container hidden" id="loginForm">
    <h2>Vendor Login</h2>
    <input type="email" placeholder="Email" required />
    <input type="password" placeholder="Password" required />
    <button onclick="showDashboard()">Login</button>
    <div class="toggle-btn" onclick="toggleForms()">Don't have an account? Register</div>
  </div>

  <div class="dashboard" id="vendorDashboard">
    <h3>Welcome to the Vendor Dashboard!</h3>
    <p>Manage your listings, check orders, and more.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    function toggleForms() {
      document.getElementById("registerForm").classList.toggle("hidden");
      document.getElementById("loginForm").classList.toggle("hidden");
    }

    function showDashboard() {
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("vendorDashboard").style.display = "block";
    }

    function logout() {
      document.getElementById("vendorDashboard").style.display = "none";
      document.getElementById("registerForm").style.display = "block";
      document.getElementById("loginForm").classList.add("hidden");
    }
  </script>
</body>
</html>
