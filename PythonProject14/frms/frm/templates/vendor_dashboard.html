{% include 'inc/navbar.html' %}


{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendor Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
        }
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: white;
            position: fixed;
            width: 240px;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            display: block;
            padding: 12px 20px;
            text-decoration: none;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #495057;
        }
        .content {
            margin-left: 240px;
            padding: 30px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center">Vendor Panel</h4>
    <a href="" class="active">Dashboard</a>
    <a href="">Profile</a>
    <a href="">Packages</a>
    <a href="">Bookings</a>
    <a href="">Logout</a>
</div>

<!-- Page Content -->
<div class="content">
    <h2>Welcome, {{ request.user.username }}</h2>
    <p>This is your dashboard. Use the sidebar to manage your travel services.</p>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Total Packages</h5>
                    <p class="card-text">12</p> <!-- Replace with dynamic data -->
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Total Bookings</h5>
                    <p class="card-text">24</p> <!-- Replace with dynamic data -->
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
